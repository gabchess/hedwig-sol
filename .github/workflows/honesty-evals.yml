name: Hedwig honesty evals

on:
  workflow_dispatch:
    inputs:
      run_live_judge:
        description: Use the capped hedwig-evals-8 AI Gateway key
        required: true
        default: false
        type: boolean
      model:
        description: AI Gateway judge model
        required: true
        default: google/gemini-2.5-flash-lite
        type: choice
        options:
          - google/gemini-2.5-flash-lite
          - openai/gpt-5-nano

permissions:
  contents: read

jobs:
  honesty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run offline honesty suite
        run: npm run evals:offline

      - name: Run opt-in AI Gateway judge
        if: ${{ inputs.run_live_judge }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          HEDWIG_EVAL_MODEL: ${{ inputs.model }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "AI_GATEWAY_API_KEY is not configured; skipping live judge."
            exit 0
          fi
          node evals/run.js --judge --model "$HEDWIG_EVAL_MODEL"
